name: Deploy static content to Pages

on:
  push:
    branches: ["main"] # আপনার ব্রাঞ্চের নাম master হলে এখানে master লিখবেন

  # আপনাকে Actions ট্যাব থেকে ম্যানুয়ালি রান করার সুবিধা দেবে
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # আপনার index.html যে ফোল্ডারে আছে (রুট ফোল্ডার)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
